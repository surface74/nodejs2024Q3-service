services:
  server:
    image: surface74/rest-server
    ports:
      - ${PORT}:${PORT}
    env_file: .env
    environment:
      PORT: ${PORT}
      LOAD_MOCK_DATA: ${LOAD_MOCK_DATA}
      POSTGRES_DOMAIN: ${POSTGRES_DOMAIN}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - frontend
    depends_on:
      - postgres
  postgres:
    image: surface74/postgres
    container_name: postgres_container
    restart: unless-stopped
    ports:
      - ${POSTGRES_HOST_PORT}:${POSTGRES_PORT}
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: '/usr/app/postgres-data/'
    volumes:
      - ./postgres-data:/usr/app/postgres-data/
    networks:
      - frontend

volumes:
  postgres-data:

networks:
  frontend:
    driver: bridge
